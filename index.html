<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Archetype Test</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0e1125;
        color: #f0f3ff;
      }
      .container {
        max-width: 900px;
        margin: 32px auto;
        padding: 24px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
      }
      h1 {
        margin-top: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
      }
      .question {
        padding: 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
      }
      select {
        width: 100%;
        margin-top: 6px;
        padding: 6px;
        border-radius: 8px;
      }
      button {
        margin-top: 16px;
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        background: #8c7bff;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      pre {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        overflow: auto;
      }
      .hint {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Magic Archetype Test</h1>
      <p class="hint">GitHub Pages 会优先显示 <code>index.html</code>。这里提供一个可直接运行的评分示例。</p>
      <div id="questions" class="grid"></div>
      <button id="calcBtn">计算原型结果</button>
      <pre id="result">点击“计算原型结果”后显示 JSON 结果</pre>
    </div>

    <script src="./src/scoringEngine.js"></script>
    <script>
      const container = document.getElementById('questions');
      const options = ['A', 'B', 'C', 'D'];

      for (let i = 1; i <= 16; i += 1) {
        const box = document.createElement('div');
        box.className = 'question';

        const label = document.createElement('label');
        label.textContent = `Q${i}`;

        const select = document.createElement('select');
        select.id = `q${i}`;

        options.forEach((opt) => {
          const optionEl = document.createElement('option');
          optionEl.value = opt;
          optionEl.textContent = opt;
          select.appendChild(optionEl);
        });

        box.appendChild(label);
        box.appendChild(select);
        container.appendChild(box);
      }

      document.getElementById('calcBtn').addEventListener('click', () => {
        const answers = [];
        for (let i = 1; i <= 16; i += 1) {
          answers.push(document.getElementById(`q${i}`).value);
        }

        const result = window.MagicArchetypeScoring.scoreMagicArchetype(answers);
        document.getElementById('result').textContent = JSON.stringify(result, null, 2);
      });
    </script>
  </body>
</html>
